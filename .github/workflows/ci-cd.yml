name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t local/n8n-rag-metrics:ci .

      - name: Save image to tar
        run: docker save local/n8n-rag-metrics:ci -o vuln-image.tar

      - name: Setup Trivy CLI
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.70.0

      - name: Run Trivy CLI against tarball (generate reports)
        run: |
          trivy image --input vuln-image.tar \
            --severity CRITICAL \
            --ignore-unfixed \
            --format json \
            --output trivy-results.json || true
          trivy image --input vuln-image.tar \
            --severity CRITICAL \
            --ignore-unfixed \
            --format table \
            --output trivy-results.txt || true
          if [ -s trivy-results.txt ]; then
            echo "::warning::Trivy produced a report (check artifacts)."
          fi
        shell: bash

      - name: Upload Trivy results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: |
            trivy-results.json
            trivy-results.txt

      - name: Cleanup
        if: always()
        run: rm -f vuln-image.tar

  docker-publish:
    needs: security-scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare lowercase GHCR image name
        id: prepare
        run: |
          # Lowercase GITHUB_REPOSITORY (owner/repo) for GHCR namespace
          echo "image=ghcr.io/$(echo $GITHUB_REPOSITORY | tr '[:upper:]' '[:lower:]'):latest" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.prepare.outputs.image }}

  dockerhub-publish:
    needs: security-scan
    if: github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker Hub image
        run: |
          docker build -t local/n8n-rag-metrics:optimized .
          docker tag local/n8n-rag-metrics:optimized docker.io/${{ secrets.DOCKERHUB_USERNAME }}/n8n-rag-metrics:optimized
          docker push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/n8n-rag-metrics:optimized
        shell: bash
