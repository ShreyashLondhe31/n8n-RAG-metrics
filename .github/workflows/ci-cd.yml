name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t local/n8n-rag-metrics:ci .

      - name: Save image to tar
        run: docker save local/n8n-rag-metrics:ci -o vuln-image.tar

      - name: Run Trivy vulnerability scan (tarball)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: vuln-image.tar
          format: table
          exit-code: 1
          ignore-unfixed: true
          scanners: vuln
          vuln-type: library
          severity: CRITICAL

      - name: Cleanup
        if: always()
        run: rm -f vuln-image.tar

  docker-publish:
    needs: security-scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ github.repository_owner }}/n8n-rag-metrics:latest
